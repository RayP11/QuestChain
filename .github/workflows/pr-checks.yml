name: PR checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# PR code runs only on disposable GitHub-hosted runners, without app secrets.
# Do not use pull_request_target or share caches with deployment workflows.
env:
  PYTHONIOENCODING: utf-8
  UV_NO_PROGRESS: '1'

jobs:
  regression:
    name: Linux regression and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: '0.13.5'
          enable-cache: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked application and test dependencies
        run: uv sync --locked --python 3.13
      - name: Python regressions (no model server required)
        env:
          QUESTCHAIN_DATA_DIR: ${{ runner.temp }}/questchain-test-data
        run: uv run --no-sync python -m pytest -q -ra
      - name: Chat markdown regressions
        run: node --test tests/chat-markdown.test.cjs
      - name: Build documentation strictly (no deployment)
        run: uv tool run --from mkdocs-material==9.6.23 mkdocs build --strict

  windows-launcher:
    name: Windows launcher upgrades
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: '0.13.5'
          enable-cache: false
      # These tests construct offline wheels; they need no application packages.
      - name: Install launcher test dependencies
        run: |
          uv venv --python 3.13
          uv pip install pytest==9.0.2 pytest-asyncio==1.3.0
      - name: Exercise both real Windows launcher upgrade paths
        env:
          QUESTCHAIN_DATA_DIR: ${{ runner.temp }}/questchain-test-data
        run: uv run --no-sync python -m pytest -q -ra tests/test_updater_windows.py
